<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Своя смена — карьерный квест | Очаково</title>
<style>
:root{--r:#ef1742;--ink:#22222a;--mut:#646470;--pale:#fff1f4;--line:#efc0ca}*{box-sizing:border-box}body{margin:0;background:#faf7f8;color:var(--ink);font-family:Arial,sans-serif}main{max-width:740px;margin:auto;padding:18px;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.brand{font-weight:900;color:var(--r)}.tag,small{font-size:11px;color:var(--mut)}.progress{height:6px;background:#f5dce2;border-radius:8px;margin:12px 0 18px;overflow:hidden}.progress span{display:block;height:100%;background:var(--r);width:0}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(20px,5vw,32px)}.k{font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:800;color:var(--r)}h1{font-size:clamp(32px,7vw,50px);line-height:1.04;margin:12px 0}h2{font-size:clamp(23px,5vw,30px);line-height:1.15;margin:12px 0}p{font-size:16px;line-height:1.5;color:var(--mut)}.red{color:var(--r)}button,.btn{display:inline-block;border:0;border-radius:12px;background:var(--r);color:white;font-weight:700;font-size:15px;padding:14px 17px;cursor:pointer;text-decoration:none}button.alt{background:white;color:var(--r);border:1px solid var(--r)}.options{display:grid;gap:10px;margin:18px 0}.options button{background:#fff;color:var(--ink);border:1px solid #e5d6da;text-align:left;line-height:1.4}.options button:hover{border-color:var(--r);background:var(--pale)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.tile{border:1px solid #eed3da;border-radius:14px;padding:15px}.tile b{display:block;margin:8px 0}.tile p{font-size:14px;margin:5px 0}.emoji{font-size:25px}.values{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0}.value{background:#fff7f8;border:1px solid #f0d4da;border-radius:12px;padding:11px;font-size:13px;line-height:1.4}.value b{display:block;color:var(--r);margin-bottom:4px}.field{display:block;width:100%;padding:13px 14px;border:1px solid #e4d8dc;border-radius:10px;font:inherit;margin:8px 0 12px;background:white}.consent{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--mut);margin:12px 0}.consent input{margin-top:3px}.notice{padding:12px 14px;border-radius:12px;background:#f2f5f8;color:#52606a;font-size:13px;line-height:1.45;margin:14px 0}.pill{display:inline-block;background:#ffe6ec;color:var(--r);border-radius:30px;padding:7px 11px;font-size:12px;font-weight:700}.feedback{border-left:4px solid var(--r);padding:12px 14px;background:#fff5f7;border-radius:0 10px 10px 0;margin:16px 0;line-height:1.5}small{display:block;line-height:1.45;margin-top:17px}footer{text-align:center;color:var(--mut);font-size:11px;margin:18px 0}@media(max-width:500px){main{padding:12px}.grid,.values{grid-template-columns:1fr}.tag{max-width:100px;text-align:right}}
</style><body><main><header><div class="brand">СВОЯ СМЕНА <span style="color:#22222a">/ ОЧАКОВО</span></div><div class="tag">КАРЬЕРНЫЙ КВЕСТ · MVP</div></header><div class="progress"><span id="bar"></span></div><section id="app" class="card"></section><footer>Концепт для хакатона. Не официальный сервис «Очаково»; HR-ценности и форма требуют согласования.</footer></main>
<script>
const app=document.getElementById('app'),bar=document.getElementById('bar');let direction='Техника и производство',answers=[];
const qs=[
{area:'Качество и технологии',q:'На линии контроля заметили, что часть бутылок отличается по уровню наполнения. Производство идёт по графику. Что предложишь сделать первым?',o:[
['Зафиксировать отклонение и проверить его по процедуре вместе с ответственным',2,'Сильный вариант: нужно подтвердить отклонение, действовать по процедуре и вовлечь ответственного.'],
['Немедленно остановить всё производство независимо от масштаба',1,'Остановка может быть необходима, но решение зависит от правил, масштаба и полномочий. Важно не игнорировать сигнал.'],
['Проверить ещё несколько бутылок, пока никому не сообщая',0,'Дополнительная проверка полезна, но задерживать сообщение о возможном отклонении рискованно.']]},
{area:'Логистика и процессы',q:'Поставщик предупреждает о возможной задержке сырья, но точной даты нет. Несколько подразделений зависят от поставки. Как действовать?',o:[
['Уточнить срок, проверить остатки и предупредить коллег о риске',2,'Так команда получает факты, оценивает критичность и может заранее рассмотреть варианты.'],
['Сразу сменить поставщика без согласования',1,'Альтернатива может помочь, но поставщика нужно проверить, а изменения согласовать.'],
['Подождать до конца дня — возможно, всё успеет прийти',0,'Ожидание без плана сокращает время на реакцию. Лучше уточнять данные заранее.']]},
{area:'Техника и производство',q:'Ты на практике и слышишь непривычный шум оборудования. Линия пока работает, а ты не отвечаешь за настройки. Что сделаешь?',o:[
['Сообщить оператору или наставнику и описать, что именно заметил',2,'Это показывает внимательность и понимание границ полномочий. Не следует самостоятельно вмешиваться в оборудование.'],
['Провернуть доступный регулятор, чтобы проверить, исчезнет ли шум',0,'Экспериментировать без разрешения опасно. Наблюдение нужно передать ответственному.'],
['Снять видео и отправить друзьям, чтобы они подсказали',0,'Это может нарушать правила предприятия и не решает проблему. Сначала сообщи ответственному.']]},
{area:'Бизнес и коммуникации',q:'Две команды по-разному понимают срок общей задачи. Есть риск задержки проекта. Какой шаг лучше?',o:[
['Сверить ожидания, зафиксировать срок и ответственных, назначить следующую проверку',2,'Так размытые ожидания превращаются в понятный план, а риск задержки становится видимым.'],
['Написать руководителю, что другая команда всё задерживает, не уточняя деталей',0,'Эскалация иногда нужна, но сначала полезно собрать факты и проверить договорённости.'],
['Сделать свою часть быстрее и надеяться, что остальные успеют',1,'Инициатива хороша, но не устраняет зависимость между командами. Нужна координация.']]},
{area:'Обучение и развитие',q:'Наставник дал задачу, но ты не до конца понял результат. Срок близко, ещё можно задать вопросы. Что выберешь?',o:[
['Уточнить критерии, предложить свой план и попросить обратную связь на раннем этапе',2,'Это сочетает самостоятельность с проверкой ожиданий и снижает риск переделки.'],
['Молча сделать как получится и показать только в самом конце',0,'Можно слишком поздно узнать, что задача понята неверно. Полезна промежуточная сверка.'],
['Попросить наставника выполнить задачу вместе с тобой целиком',1,'Поддержка уместна, но лучше сначала обозначить, что уже понял и где конкретно нужна помощь.']]}];
function start(){answers=[];bar.style.width='0';app.innerHTML=`<div class="k">Своя смена / Очаково</div><h1>Создавай настоящее <span class="red">вместе</span>.</h1><p>«Очаково» — производитель напитков, история которого началась в 1978 году. Компания описывает свой подход через три принципа: натуральность, инновации и традиции.</p><div class="feedback"><b>Зачем этот квест?</b><br>Чтобы увидеть, какие задачи стоят за продуктом, попробовать себя в рабочих ситуациях и выбрать направление, о котором хочется узнать больше.</div><h2>Что объединяет команду</h2><div class="values"><div class="value"><b>Профессиональное развитие</b>Применять знания, осваивать навыки и расти.</div><div class="value"><b>Командная работа</b>Обмениваться опытом и решать общие задачи.</div><div class="value"><b>Практическая значимость</b>Понимать вклад своей работы в общий результат.</div><div class="value"><b>Открытость новому</b>Предлагать идеи и осваивать технологии.</div><div class="value"><b>Стабильность и перспективы</b>Получать опыт и развиваться в профессии.</div><div class="value"><b>Преемственность поколений</b>Соединять опыт команды и инициативу новичков.</div></div><p><b>Твоя задача:</b> пройти пять ситуаций и получить маршрут для дальнейшего знакомства с направлениями работы.</p><button onclick="launchQuest()">Перейти к квесту →</button><small>История и принципы компании основаны на официальном сайте. Ценности HR-бренда в этом прототипе представлены как концепция проекта и требуют согласования с компанией. Квест не является тестом профпригодности.</small>`}
function launchQuest(){answers=[];bar.style.width='0';app.innerHTML=`<div class="k">Найди своё направление</div><h1>Твоя следующая <span class="red">смена</span> может стать карьерным стартом.</h1><p>Познакомься с задачами, попробуй разные способы решения и посмотри, какие направления тебе интересны.</p><div class="grid"><div class="tile"><span class="emoji">⚙️</span><b>Техника и производство</b><p>Оборудование, процессы, автоматизация</p></div><div class="tile"><span class="emoji">🧪</span><b>Качество и технологии</b><p>Контроль, лаборатория, стандарты</p></div><div class="tile"><span class="emoji">🚚</span><b>Логистика и процессы</b><p>Поставки, планирование, координация</p></div><div class="tile"><span class="emoji">📊</span><b>Бизнес и коммуникации</b><p>Команды, проекты, аналитика</p></div></div><button onclick="fact()">Начать →</button><small>Квест знакомит с рабочими ситуациями, но не является тестом профпригодности.</small>`}
function fact(){bar.style.width='10%';app.innerHTML=`<div class="k">01 · Узнай</div><h2>За продуктом — целая система</h2><p>«Очаково» рассказывает о традициях, инновациях, собственном производстве солода и технологических новшествах в производстве напитков.</p><div class="feedback">За привычным продуктом стоят специалисты производства, качества, инженерии, логистики и бизнеса.</div><p>Здесь не нужно угадать «идеального сотрудника» — попробуй разобраться, как действовать в неоднозначной ситуации.</p><button onclick="choose()">Выбрать интерес →</button>`}
function choose(){bar.style.width='20%';app.innerHTML=`<div class="k">02 · Выбери</div><h2>Что тебе ближе?</h2><p>Выбор персонализирует карточку результата, но не ограничивает доступные профессии.</p><div class="options">${['Техника и производство','Качество и технологии','Логистика и процессы','Бизнес и коммуникации'].map(d=>`<button onclick="direction='${d}';question(0)">${d} →</button>`).join('')}</div>`}
function question(i){bar.style.width=(30+i*13)+'%';let q=qs[i];app.innerHTML=`<div class="k">03 · Ситуация ${i+1} из ${qs.length}</div><span class="pill">${q.area}</span><h2>${q.q}</h2><div class="options">${q.o.map((o,j)=>`<button onclick="answer(${i},${j})">${o[0]}</button>`).join('')}</div><small>В реальной работе приоритет имеют правила предприятия и указания ответственных специалистов. Сценарии демонстрационные.</small>`}
function answer(i,j){let o=qs[i].o[j];answers.push(o[1]);app.innerHTML=`<div class="k">Разбор ситуации ${i+1}</div><h2>${o[1]===2?'Сильный вариант':o[1]===1?'Есть важные оговорки':'Есть риск'}</h2><div class="feedback">${o[2]}</div><p>Важны контекст, безопасность, коммуникация и границы ответственности. Не всегда достаточно выбрать действие, которое звучит решительно.</p><button onclick="${i<qs.length-1?`question(${i+1})`:'result()'}">${i<qs.length-1?'Следующая ситуация →':'Посмотреть результат →'}</button>`}
function result(){bar.style.width='100%';let n=answers.reduce((a,b)=>a+b,0),msg=n>=8?'В ответах заметен системный подход: ты учитываешь данные, риски и командную работу.':n>=5?'Ты находишь рабочие варианты; следующий шаг — чаще проверять контекст, риски и договорённости.':'Рабочие ситуации бывают неоднозначны. Сравни объяснения и попробуй пройти квест ещё раз.';app.innerHTML=`<div class="k">04 · Твой маршрут</div><span class="pill">Направление интереса</span><h1>${direction}</h1><p>${msg}</p><div class="tile"><b>Что можно развивать</b><p>Внимательность · анализ ситуации · коммуникация · понимание процессов</p></div><h2>Следующий шаг</h2><p>Посмотри официальную информацию о компании. Актуальные вакансии, условия и наличие практики нужно подтвердить у HR.</p><a class="btn" href="https://ochakovo.ru/kompaniya/" target="_blank" rel="noopener">О компании «Очаково» ↗</a><h2 style="margin-top:26px">Хочешь узнать о карьерных возможностях?</h2><p>Оставь контакт только если хочешь, чтобы представитель компании связался с тобой по поводу вакансий или практики.</p><form id="leadForm" onsubmit="submitLead(event)"><label for="leadName"><b>Имя</b> <span class="tag">(необязательно)</span></label><input class="field" id="leadName" name="name" autocomplete="name" maxlength="80" placeholder="Как к тебе обращаться"><label for="leadEmail"><b>Email</b> <span class="tag">(необязательно)</span></label><input class="field" id="leadEmail" name="email" type="email" autocomplete="email" maxlength="120" placeholder="name@example.com"><label for="leadRole"><b>Что интересно?</b></label><select class="field" id="leadRole" name="interest"><option>Техника и производство</option><option>Качество и технологии</option><option>Логистика и процессы</option><option>Бизнес и коммуникации</option><option>Любые подходящие стажировки</option></select><label class="consent"><input type="checkbox" id="leadConsent" required><span>Я согласен(на) на обработку указанных мной данных для ответа на мой запрос о карьерных возможностях. Я понимаю, что в этой демонстрационной версии данные не отправляются и не сохраняются.</span></label><div class="notice">Демонстрационный режим: форма пока не подключена к HR-системе и не передаёт данные. Перед реальным запуском её необходимо связать с согласованной компанией формой сбора заявок и разместить утверждённые документы об обработке персональных данных.</div><button type="submit">Проверить форму</button></form><button class="alt" onclick="start()" style="margin-top:12px">Пройти заново</button><small>Результат не ранжирует кандидатов и не определяет профессиональную пригодность.</small>`}
function submitLead(e){e.preventDefault();const box=document.getElementById('leadForm');if(!document.getElementById('leadConsent').checked){return;}box.insertAdjacentHTML('beforeend','<div class="feedback" role="status"><b>Это демонстрация формы.</b><br>Данные не отправлены и не сохранены. Для реального сбора заявок подключите форму, одобренную HR и ответственным за персональные данные.</div>');const btn=box.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Демонстрация проверена';}
start();
</script></body></html>
